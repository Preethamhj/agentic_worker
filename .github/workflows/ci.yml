name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Environment Setup
        shell: powershell
        run: |
          .\scripts\setup-windows.ps1 -SkipOllamaPull -SkipOllamaCheck

      - name: Show Locked Python Client Versions
        shell: powershell
        run: |
          .\ai-server\.venv\Scripts\python.exe -m pip show ollama httpx

      - name: Run All Checks
        shell: powershell
        run: |
          .\scripts\check-all.ps1

      - name: Run Evaluation Python Gate
        shell: powershell
        run: |
          .\ai-server\.venv\Scripts\python.exe -m pytest eval/tests
          .\ai-server\.venv\Scripts\ruff.exe check eval
          .\ai-server\.venv\Scripts\mypy.exe --strict --explicit-package-bases eval
